[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "mrnavax-rare"
version = "0.10.1"
description = "mRNA therapeutics design toolkit for rare Mendelian diseases — extension of mrnavax. Codon + UTR + LNP + indication-aware protein-replacement design, AAV gene-therapy vector design (v0.10), wet-lab validated minigene + split-intein + cell-type-enhancer support (v0.10.1)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later OR LicenseRef-Commercial" }
authors = [
    { name = "Royce Lam", email = "roycelam@umich.edu" },
]
keywords = [
    "aidd", "mrna-therapeutics", "rare-diseases", "protein-replacement",
    "mendelian-disease", "alphagenome", "alphamissense", "boltz", "aav",
    "aav-gene-therapy", "split-intein", "cftr", "scn1a", "dravet",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "mrnavax>=0.34.6",
]

[project.optional-dependencies]
protein-structure = [
    "boltz>=0.2",
]
kg = [
    "py-idp>=0.1",
    "speaksql>=0.1",
]
admet = [
    "pyTDC>=0.4",
]
chem = [
    "rdkit>=2024.9",
    "meeko>=0.3",
]
docking = [
    "vina>=1.2",
]
docs = [
    "mkdocs-material>=9.6",
    "mkdocs-static-i18n>=1.3",
    "mkdocstrings[python]>=0.27",
]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]
all = [
    "mrnavax-rare[protein-structure,kg,admet,chem,docking,docs,dev]",
]

[project.urls]
Homepage = "https://github.com/rollroyces/mrnavax-rare"
Issues = "https://github.com/rollroyces/mrnavax-rare/issues"
Sister = "https://github.com/rollroyces/mrnavax"
"Inspiration (AlphaGenome SCN1A)" = "https://github.com/rollroyces/alphagenome-scn1a-pipeline"

[tool.hatch.build.targets.wheel]
packages = ["mrnavax_rare"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
